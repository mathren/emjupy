# melpazoid <https://github.com/riscy/melpazoid> build checks.

# If your package is on GitHub, enable melpazoid's checks by copying this file
# to .github/workflows/melpazoid.yml and modifying RECIPE and EXIST_OK below.

name: melpazoid
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.10' }
    - name: Install
      run: |
        sudo apt-get install emacs && emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        WARN_IS_ERROR: true
        EXIST_OK: false
      # The recipe is read from the file MELPA will be sent, rather than
      # copied here: a second copy goes stale the first time a source file
      # is added, and then this checks a package nobody will install.
      run: |
        export RECIPE="$(cat .github/melpa-recipe)"
        echo "$RECIPE"
        echo $GITHUB_REF && make -C ~/melpazoid
