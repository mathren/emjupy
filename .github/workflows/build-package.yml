name: Build Emacs Package

on:
  # Creates the "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

  # Triggers automatically on push if an Elisp file or Makefile changes
  push:
    paths:
      - '**/*.el'
      - 'Makefile'

  # Triggers automatically on pull requests if an Elisp file or Makefile changes
  pull_request:
    paths:
      - '**/*.el'
      - 'Makefile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Emacs on the runner (Required if your Makefile uses the 'emacs' command)
      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.3'

      - name: Clean and Check
        run: |
          make clean
          make check

      - name: Package
        run: |
          make package
