name: Build

# One workflow for everything a change can break; the others do what
# only they do.  What runs on each event, so each check runs once:
#
#   pull request                 this workflow: check, integration, melpazoid
#   push to main                 this workflow's check and melpazoid, and
#                                coverage.yml, which runs the whole suite
#                                once, instrumented, in place of integration
#   tag                          release.yml only -- it tests what it ships
#
# Pushes to other branches run nothing until a pull request; a pull
# request from this repository runs once, not for the push too.
on:
  # Creates the "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - '**/*.el'
      - 'Makefile'
      - '.github/workflows/*.yml'
      - '.github/melpa-recipe'
      - 'docs/**'
      - 'README.org'
      - 'publish.el'
      - 'tools/**'
      - 'test_notebooks/**'

  pull_request:
    # the same list as for push
    paths:
      - '**/*.el'
      - 'Makefile'
      - '.github/workflows/*.yml'
      - '.github/melpa-recipe'
      - 'docs/**'
      - 'README.org'
      - 'publish.el'
      - 'tools/**'
      - 'test_notebooks/**'

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for all that needs only Emacs.  The recipe check byte-compiles
  # every file, as MELPA does, warnings failing it.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Fetch websocket.el
        run: git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git "$RUNNER_TEMP/websocket"

      - name: Install package-lint
        run: |
          emacs -batch -Q --eval "(progn \
            (require 'package) \
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) \
            (package-initialize) \
            (package-refresh-contents) \
            (package-install 'package-lint))"

      - name: checkdoc and package-lint
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
        run: make lint

      # The notebooks to try emjupy on are committed without outputs, and
      # the corpus is what its generator writes: neither changes in git by
      # being run.
      - name: Check the test notebooks are as committed
        run: |
          pip install --quiet nbstripout nbformat
          nbstripout --keep-id --verify test_notebooks/*.ipynb
          python3 tools/make-notebook-corpus.py
          git diff --exit-code -- test_notebooks/test-corpus

      - name: Compile, as MELPA builds the package from its recipe
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
        run: make recipe-check

      - name: Package
        run: make package

      - name: Serve Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emjupy
          path: '*.tar'

      - name: Export the docs
        run: make docs

      - name: Check every internal link resolves
        run: python3 tools/check-links.py html-content

      - name: Keep the exported site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: html-content

      # Drawn from the code by `make docs', above: the files and the
      # requires between them, as an SVG and as Graphviz's DOT.
      - name: Keep the dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: html-content/dependencies.*

  # The tests against a real server, kernel and language server, for pull
  # requests and by hand; on main, coverage.yml runs them.  The tests that
  # time things, skipped there, run here.
  integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Fetch websocket.el
        run: git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git "$RUNNER_TEMP/websocket"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # jupyter-lsp is the plumbing; python-lsp-server is the language server
      # itself.  Neither installs the other, and the LSP tests need both.
      - name: Install Jupyter and a language server
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-server ipykernel jupyter-lsp 'python-lsp-server[all]' numpy matplotlib

      - name: Start a Jupyter server
        run: |
          mkdir -p "$RUNNER_TEMP/nbroot"
          nohup jupyter server --no-browser --port=8888 --ip=127.0.0.1 \
            --IdentityProvider.token=emjupy-ci \
            --ServerApp.root_dir="$RUNNER_TEMP/nbroot" \
            > "$RUNNER_TEMP/jupyter.log" 2>&1 &
          # Waited for rather than slept through: a slow runner would
          # otherwise fail in a way that reads as a code fault.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8888/api/status?token=emjupy-ci"; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"
          cat "$RUNNER_TEMP/jupyter.log"
          exit 1

      - name: Unit and integration tests
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
          EMJUPY_TEST_URL: 127.0.0.1:8888
          EMJUPY_TEST_TOKEN: emjupy-ci
          EMJUPY_TEST_ROOT: ${{ runner.temp }}/nbroot
          # Tests of a known, unfixed fault are tagged :unstable and left
          # out: a job failing at random teaches people to ignore it.
          EMJUPY_SKIP_UNSTABLE: '1'
        run: |
          make clean
          make check

      - name: Jupyter log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/jupyter.log"

  # melpazoid against the recipe MELPA will build, as its reviewers do.
  melpazoid:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.10' }
    - name: Install
      run: |
        sudo apt-get install emacs && emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
        pip install -e ~/melpazoid[dev]
        pip install mypy
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        WARN_IS_ERROR: true
        EXIST_OK: false
      # The recipe is read from the file MELPA will be sent, rather than
      # copied here: a second copy goes stale the first time a source file
      # is added, and then this checks a package nobody will install.
      run: |
        export RECIPE="$(cat .github/melpa-recipe)"
        echo "$RECIPE"
        echo $GITHUB_REF && make -C ~/melpazoid
