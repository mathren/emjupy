name: Build

# One workflow for everything a change can break; the others do what
# only they do.  What runs on each event, so each check runs once:
#
#   push to main, pull request   this workflow (the tests, once)
#   push to main                 + coverage.yml, for the badge
#   tag                          release.yml only -- it tests what it ships
#
# Pushes to other branches run nothing until a pull request is opened, and
# a pull request from a branch of this repository is not run twice, once
# for the push and once for the request.  A tag starts none of this: path
# filters are not applied to tag pushes, so a tag used to run this
# workflow and coverage.yml as well as the release.
on:
  # Creates the "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - '**/*.el'
      - 'Makefile'
      - '.github/workflows/*.yml'
      - '.github/melpa-recipe'
      - 'docs/**'
      - 'README.org'
      - 'publish.el'
      - 'tools/**'
      - 'src/test-corpus/**'

  pull_request:
    # the same list as for push
    paths:
      - '**/*.el'
      - 'Makefile'
      - '.github/workflows/*.yml'
      - '.github/melpa-recipe'
      - 'docs/**'
      - 'README.org'
      - 'publish.el'
      - 'tools/**'
      - 'src/test-corpus/**'

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles with warnings as errors and builds the package tar.  The tests
  # run once, in the integration job -- unit tests included -- not here too.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # The one dependency.  Vendored rather than installed from an archive,
      # so the build does not depend on MELPA being reachable.
      - name: Fetch websocket.el
        run: git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git "$RUNNER_TEMP/websocket"

      - name: Compile
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
        run: |
          make clean
          make compile

      - name: Package
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
        run: make package

      - name: Serve Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emjupy
          path: '*.tar'

  # What a MELPA review checks.  Separate from the tests, so a docstring
  # complaint does not read as a broken build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Fetch websocket.el
        run: git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git "$RUNNER_TEMP/websocket"

      - name: Install package-lint
        run: |
          emacs -batch -Q --eval "(progn \
            (require 'package) \
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) \
            (package-initialize) \
            (package-refresh-contents) \
            (package-install 'package-lint))"

      - name: checkdoc and package-lint
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
        run: make lint

  # The documentation is Org, and Org export is the thing most likely to
  # break silently: a stale link renders fine on GitHub and 404s in the
  # exported site.  Built here so that cannot happen unnoticed, and
  # published so the site is whatever main says it is.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Export the docs
        run: make docs

      - name: Check every internal link resolves
        run: python3 tools/check-links.py html-content

      # Built and checked on every push, published only on a tag: the
      # site documents the released package, not main as it stands.
      # See release.yml.
      - name: Keep the exported site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: html-content

  # The tests that talk to a real server, a real kernel and a real language
  # server: the ones most likely to catch a regression in the WebSocket,
  # session or LSP paths.  Until now they ran only if someone remembered to
  # run them by hand.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Fetch websocket.el
        run: git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git "$RUNNER_TEMP/websocket"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # jupyter-lsp is the plumbing; python-lsp-server is the language server
      # itself.  Neither installs the other, and the LSP tests need both.
      - name: Install Jupyter and a language server
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-server ipykernel jupyter-lsp 'python-lsp-server[all]' numpy matplotlib

      - name: Start a Jupyter server
        run: |
          mkdir -p "$RUNNER_TEMP/nbroot"
          nohup jupyter server --no-browser --port=8888 --ip=127.0.0.1 \
            --IdentityProvider.token=emjupy-ci \
            --ServerApp.root_dir="$RUNNER_TEMP/nbroot" \
            > "$RUNNER_TEMP/jupyter.log" 2>&1 &
          # Waited for rather than slept through: a slow runner would
          # otherwise fail in a way that reads as a code fault.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8888/api/status?token=emjupy-ci"; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"
          cat "$RUNNER_TEMP/jupyter.log"
          exit 1

      - name: Unit and integration tests
        env:
          EMJUPY_WEBSOCKET_DIR: ${{ runner.temp }}/websocket
          EMJUPY_TEST_URL: 127.0.0.1:8888
          EMJUPY_TEST_TOKEN: emjupy-ci
          EMJUPY_TEST_ROOT: ${{ runner.temp }}/nbroot
          # Tests whose subject is a known, unfixed fault are tagged
          # :unstable and left out here.  They fail some of the time and
          # say something true when they do, so they stay in the suite --
          # but a job that fails at random teaches people to ignore it.
          EMJUPY_SKIP_UNSTABLE: '1'
        run: |
          make clean
          make check

      - name: Jupyter log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/jupyter.log"

  # melpazoid against the recipe MELPA will build, as its reviewers do.
  melpazoid:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.10' }
    - name: Install
      run: |
        sudo apt-get install emacs && emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
        pip install -e ~/melpazoid[dev]
        pip install mypy
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        WARN_IS_ERROR: true
        EXIST_OK: false
      # The recipe is read from the file MELPA will be sent, rather than
      # copied here: a second copy goes stale the first time a source file
      # is added, and then this checks a package nobody will install.
      run: |
        export RECIPE="$(cat .github/melpa-recipe)"
        echo "$RECIPE"
        echo $GITHUB_REF && make -C ~/melpazoid
