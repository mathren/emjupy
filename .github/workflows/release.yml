name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@v6.0
        with:
          version: '30.1'
          nix-extra-experimental-features: 'flakes'

      - name: Check tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^;; Version: \(.*\)/\1/p' emjupy.el)
          echo "tag=$tag  header version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match ';; Version: $version' in emjupy.el."
            exit 1
          fi

      - name: Check
        run: make check

      - name: Package
        run: make package

      - name: Verify the tar was built
        run: |
          ls -l ./*.tar
          test -s "emjupy-$(sed -n 's/^;; Version: \(.*\)/\1/p' emjupy.el).tar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar'
          generate_release_notes: true
