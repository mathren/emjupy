name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Emacs on the runner (Required if your Makefile uses the 'emacs' command)
      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # The tar is named from the "Version:" header, not from the tag, and
      # package.el installs whatever the file says. Tagging 0.1.1 while the
      # header still reads 0.1.0 would publish emjupy-0.1.0.tar under a 0.1.1
      # release, and users would get 0.1.0 with nothing to indicate it.
      - name: Check tag matches the package version
        run: make check-version TAG="${GITHUB_REF_NAME}"

      - name: Check
        run: make check

      - name: Package
        run: make package

      - name: Verify the tar was built
        run: |
          ls -l ./*.tar
          test -s "emjupy-$(sed -n 's/^;; Version: \(.*\)/\1/p' emjupy.el).tar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar'
          generate_release_notes: true
